[package]
name = "localbeat-tunnel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embedded userspace WireGuard + loopback HTTP bridge for LocalBeat Android (JNI)"

[lib]
name = "localbeat_tunnel"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
boringtun = "0.7"
getrandom = "0.2"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
